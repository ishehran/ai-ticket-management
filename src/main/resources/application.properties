spring.application.name=ai-ticket-management
server.port=8011

management.endpoints.web.exposure.include=*
management.tracing.sampling.probability=1

# =====================================================================
# STANDARD CHAT MODEL CONFIGURATION (UNCOMMENTED SO YOUR BEAN CAN LOAD)
# =====================================================================
langchain4j.azure-open-ai.chat-model.endpoint=https://salesautomation-open-ai.openai.azure.com/
langchain4j.azure-open-ai.chat-model.api-key=${AZURE_OPENAI_KEY}
langchain4j.azure-open-ai.chat-model.deployment-name=gpt-5-mini

# =====================================================================
# STREAMING CHAT MODEL CONFIGURATION (Keep commented if unused)
# =====================================================================
langchain4j.azure-open-ai.streaming-chat-model.endpoint=https://salesautomation-open-ai.openai.azure.com/
langchain4j.azure-open-ai.streaming-chat-model.api-key=${AZURE_OPENAI_KEY}
langchain4j.azure-open-ai.streaming-chat-model.deployment-name=gpt-5-mini


# =====================================================================
# LOGGING & DEBUGGING
# =====================================================================
logging.level.dev.langchain4j=DEBUG
langchain4j.azure-open-ai.chat-model.log-requests=true
langchain4j.azure-open-ai.chat-model.log-responses=true
langchain4j.azure-open-ai.chat-model.temperature=1

# =====================================================================
# JSON Schema Configuration
# =====================================================================
langchain4j.azure-open-ai.chat-model.supported-capabilities=RESPONSE_FORMAT_JSON_SCHEMA
langchain4j.azure-open-ai.chat-model.strict-json-schema=true

# Database Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/ticket_system?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Shahran@12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
